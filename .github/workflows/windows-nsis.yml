# Windows 安装包流水线（NSIS）。触发：推 main = 构建 + 留 artifact（不发布）；推 v* 标签额外打 Release。
# 口径（见 docs/RUN_AND_PACKAGING.md）：依赖安装 → 单元测试（fail 0 / skipped 0）→ 类型检查 → 验收六路径
# → 浏览器守卫（PASS N / SKIP 0 / FAIL 0）→ Rust 测试 → 打包 → 安装包静态校验 → 校验和。
# 每个 run 块都显式查 $LASTEXITCODE：pwsh 不会因原生命令非 0 自动失败，不查的话「步骤全绿」只是没人看退出码。
# 命令之间不串 &&（npm 的 script-shell 可能是 PowerShell，语义会变且失败容易被吞）；
# 工具都走仓内 `node node_modules/...` 直接路径（本机 PowerShell 也会拒包管理器的临时执行器：SecurityError）。
name: windows-nsis

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# CARGO_TARGET_DIR 的唯一真源就在这里：脚本与校验步骤都从这个目录读产物，
# 不设的话 tauri/cargo 会在 src-tauri/target 下自己找地方，步骤之间就会各看各的目录。
env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
  RUST_BACKTRACE: "1"

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 准备 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 注册表与构建目录
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 安装依赖（npm ci）
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { Write-Error "npm ci 失败（退出码 $LASTEXITCODE）"; exit 1 }

      # 差分测试（test/reference-parity.test.mjs）逐字比对参考实现的源码：按 docs/API_CONTRACT.md 记录的固定提交取到 .tmp/reference-repo/，
      # 不取的话那 6 条按缺席跳过，而下一步要求 skipped 0。.tmp/ 不进打包输入。
      - name: 取参考实现（固定提交，供差分测试）
        shell: pwsh
        run: |
          git clone --quiet https://github.com/talongao/huawei-music-desktop.git .tmp/reference-repo
          if ($LASTEXITCODE -ne 0) { Write-Error "参考实现克隆失败（退出码 $LASTEXITCODE）"; exit 1 }
          git -C .tmp/reference-repo checkout --quiet --detach 3fd67319fa4b4a10de00d6da7d88e4e52ebd8327
          if ($LASTEXITCODE -ne 0) { Write-Error "参考实现检出固定提交失败（退出码 $LASTEXITCODE）"; exit 1 }

      - name: 单元测试（npm run test，断言 fail 0 / skipped 0）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .tmp/ci | Out-Null
          # 计数从稳定的 reporter 里读：NODE_OPTIONS 传 --test-reporter=tap。不用 `npm run test -- --test-reporter=tap`：
          # npm 把追加参数放在位置参数之后，而 node 从第一个位置参数起就不再解析自己的选项（实测会把它当模块 require）。
          $env:NODE_OPTIONS = "--test-reporter=tap"
          npm run test 2>&1 | Tee-Object -FilePath .tmp/ci/npm-test.tap
          if ($LASTEXITCODE -ne 0) { Write-Error "npm run test 失败（退出码 $LASTEXITCODE）"; exit 1 }
          $tap = Get-Content .tmp/ci/npm-test.tap -Raw
          if ($tap -notmatch '(?m)^# fail 0\s*$') { Write-Error "单元测试有失败：要求 fail 0（TAP 汇总）"; exit 1 }
          if ($tap -notmatch '(?m)^# skipped 0\s*$') { Write-Error "单元测试有跳过：要求 skipped 0（跳过的测试不算验过）"; exit 1 }
          Write-Output "npm run test：fail 0 / skipped 0"

      - name: 类型检查（npm run typecheck）
        shell: pwsh
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { Write-Error "npm run typecheck 失败（退出码 $LASTEXITCODE）"; exit 1 }

      - name: 验收六路径（npm run test:acceptance）
        shell: pwsh
        run: |
          npm run test:acceptance 2>&1 | Tee-Object -FilePath .tmp/ci/acceptance.log
          if ($LASTEXITCODE -ne 0) { Write-Error "npm run test:acceptance 失败（退出码 $LASTEXITCODE）"; exit 1 }
          $acceptance = Get-Content .tmp/ci/acceptance.log -Raw
          if ($acceptance -notmatch 'PASS \d+ / SKIP 0 / FAIL 0') { Write-Error "验收没有 PASS N / SKIP 0 / FAIL 0（SKIP 不算 PASS）"; exit 1 }
          Write-Output "验收六路径：PASS N / SKIP 0 / FAIL 0"

      - name: 安装 Chromium（浏览器守卫用）
        shell: pwsh
        run: |
          node node_modules/playwright-core/cli.js install chromium
          if ($LASTEXITCODE -ne 0) { Write-Error "Chromium 安装失败（退出码 $LASTEXITCODE）"; exit 1 }

      - name: 构建产物（sidecar + 渲染层）
        shell: pwsh
        run: |
          npm run dist:sidecar
          if ($LASTEXITCODE -ne 0) { Write-Error "npm run dist:sidecar 失败（退出码 $LASTEXITCODE）"; exit 1 }
          npm run build:web
          if ($LASTEXITCODE -ne 0) { Write-Error "npm run build:web 失败（退出码 $LASTEXITCODE）"; exit 1 }

      - name: 浏览器守卫（npm run test:browser，断言 PASS N / SKIP 0 / FAIL 0）
        shell: pwsh
        run: |
          npm run test:browser 2>&1 | Tee-Object -FilePath .tmp/ci/test-browser.log
          if ($LASTEXITCODE -ne 0) { Write-Error "npm run test:browser 失败（退出码 $LASTEXITCODE）"; exit 1 }
          $guard = Get-Content .tmp/ci/test-browser.log -Raw
          if ($guard -notmatch 'PASS \d+ / SKIP 0 / FAIL 0') { Write-Error "浏览器守卫没有 PASS N / SKIP 0 / FAIL 0（SKIP 不算成功）"; exit 1 }
          Write-Output "浏览器守卫：PASS N / SKIP 0 / FAIL 0"

      - name: Rust 测试（cargo test）
        shell: pwsh
        working-directory: src-tauri
        run: |
          cargo test
          if ($LASTEXITCODE -ne 0) { Write-Error "cargo test 失败（退出码 $LASTEXITCODE）"; exit 1 }

      - name: 打包安装包（npm run dist:win）
        shell: pwsh
        run: |
          npm run dist:win
          if ($LASTEXITCODE -ne 0) { Write-Error "npm run dist:win 失败（退出码 $LASTEXITCODE）"; exit 1 }

      - name: 安装包静态校验（npm run check:nsis）
        shell: pwsh
        run: |
          npm run check:nsis
          if ($LASTEXITCODE -ne 0) { Write-Error "npm run check:nsis 失败（退出码 $LASTEXITCODE）"; exit 1 }

      - name: 生成 SHA256SUMS（npm run release:checksums）
        shell: pwsh
        run: |
          npm run release:checksums
          if ($LASTEXITCODE -ne 0) { Write-Error "npm run release:checksums 失败（退出码 $LASTEXITCODE）"; exit 1 }
          if (-not (Test-Path "$env:CARGO_TARGET_DIR/release/bundle/nsis/SHA256SUMS")) { Write-Error "SHA256SUMS 没写出来"; exit 1 }

      # 注：真窗冒烟（npm run smoke:build）不进 CI——它要一个交互式桌面会话，在无人值守的运行器上只会得到
      # UNTESTED，把「没测」写进绿色流水线比不写更糟。它是本地/发布前的人工步骤，口径见 docs/RUN_AND_PACKAGING.md。

      - name: 上传产物（main 推送与标签都留 artifact）
        uses: actions/upload-artifact@v4
        with:
          name: huawei-music-desktop-windows-nsis
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS
            src-tauri/binaries/hwmusic-core-*.exe

      - name: 发布 Release（仅 v* 标签）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS
          body: |
            ## 华为音乐第三方桌面客户端 ${{ github.ref_name }}（Windows / NSIS）

            下面是四句必须先读完的话，然后才是安装包：

            1. **未签名**：本安装包没有代码签名证书，Windows SmartScreen 会提示"未知发布者"。
               这不是被篡改的证据，但也意味着**没有任何东西替你担保这个文件**——请用同一 Release 里的
               `SHA256SUMS` 自己核一遍（`certutil -hashfile <安装包> SHA256`）。
            2. **非官方**：这是第三方独立实现，与华为及其关联公司没有任何隶属、合作或代理关系，
               **不是官方发布物**；官方 App 的一切权利仍归官方。
            3. **OAuth 身份不属于本项目**：登录走官方页面，用的是**上游项目注册的** OAuth client id
               （源码见 `src/protocols/auth.mjs`），它不是本项目注册的应用身份，
               本项目也不持有任何官方凭据。登录凭据只落本机（DPAPI 保护的会话信封），
               不进发布物、不进 CI。
            4. **AGPL 完整源码**：本项目以 AGPL-3.0-only 授权，**对应版本的完整源码**在
               ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }} 提供（本 Release 对应的提交）；
               AGPL 要求拿到二进制的人能拿到对应源码，所以这个链接必须指向本 Release 对应的提交。
