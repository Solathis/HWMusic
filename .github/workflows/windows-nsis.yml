# Windows 安装包流水线（NSIS）。触发：推 main = 构建 + 留 artifact（不发布）；推 v* 标签额外打 Release。
# 口径：依赖安装 → 类型检查 → 浏览器守卫（PASS N / SKIP 0 / FAIL 0）→ Rust 测试 → 打包 → 安装包静态校验 → 校验和 → 发布用资产（英文文件名）。
# 单元、契约测试与验收脚本只留在本地 test/（不入库），CI 不跑。
# 每个 run 块都显式查 $LASTEXITCODE：pwsh 不会因原生命令非 0 自动失败，不查的话「步骤全绿」只是没人看退出码。
# 命令之间不串 &&（npm 的 script-shell 可能是 PowerShell，语义会变且失败容易被吞）；
# 工具都走仓内 `node node_modules/...` 直接路径（本机 PowerShell 也会拒包管理器的临时执行器：SecurityError）。
name: windows-nsis

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# CARGO_TARGET_DIR 的唯一真源就在这里：脚本与校验步骤都从这个目录读产物，
# 不设的话 tauri/cargo 会在 src-tauri/target 下自己找地方，步骤之间就会各看各的目录。
env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
  RUST_BACKTRACE: "1"

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 准备 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 注册表与构建目录
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 安装依赖（npm ci）
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { Write-Error "npm ci 失败（退出码 $LASTEXITCODE）"; exit 1 }

      - name: 类型检查（npm run typecheck）
        shell: pwsh
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { Write-Error "npm run typecheck 失败（退出码 $LASTEXITCODE）"; exit 1 }

      - name: 安装 Chromium（浏览器守卫用）
        shell: pwsh
        run: |
          node node_modules/playwright-core/cli.js install chromium
          if ($LASTEXITCODE -ne 0) { Write-Error "Chromium 安装失败（退出码 $LASTEXITCODE）"; exit 1 }

      - name: 构建产物（sidecar + 渲染层）
        shell: pwsh
        run: |
          npm run dist:sidecar
          if ($LASTEXITCODE -ne 0) { Write-Error "npm run dist:sidecar 失败（退出码 $LASTEXITCODE）"; exit 1 }
          npm run build:web
          if ($LASTEXITCODE -ne 0) { Write-Error "npm run build:web 失败（退出码 $LASTEXITCODE）"; exit 1 }

      - name: 浏览器守卫（npm run test:browser，断言 PASS N / SKIP 0 / FAIL 0）
        # 运行器没有 GPU，页面走软件光栅化，比本机慢得多：等待上限放宽到 60 秒（本机默认 15 秒）
        env:
          HWMUSIC_GUARD_TIMEOUT_MS: "60000"
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .tmp/ci | Out-Null
          npm run test:browser 2>&1 | Tee-Object -FilePath .tmp/ci/test-browser.log
          if ($LASTEXITCODE -ne 0) { Write-Error "npm run test:browser 失败（退出码 $LASTEXITCODE）"; exit 1 }
          $guard = Get-Content .tmp/ci/test-browser.log -Raw
          if ($guard -notmatch 'PASS \d+ / SKIP 0 / FAIL 0') { Write-Error "浏览器守卫没有 PASS N / SKIP 0 / FAIL 0（SKIP 不算成功）"; exit 1 }
          Write-Output "浏览器守卫：PASS N / SKIP 0 / FAIL 0"

      - name: 上传浏览器守卫失败现场（截图与日志）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-guard-failure
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
          path: |
            .tmp/browser-guard/
            .tmp/ci/test-browser.log

      - name: Rust 测试（cargo test）
        shell: pwsh
        working-directory: src-tauri
        run: |
          cargo test
          if ($LASTEXITCODE -ne 0) { Write-Error "cargo test 失败（退出码 $LASTEXITCODE）"; exit 1 }

      - name: 打包安装包（npm run dist:win）
        # 有 secret 才产更新签名（PR 与 fork 没有 secret，照常出包、不带 .sig）
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: pwsh
        run: |
          # 缓存恢复的 target 里可能留着旧版本安装包：不清掉的话「恰好一个安装包」的校验会失败，旧包还可能混进 Release
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$env:CARGO_TARGET_DIR/release/bundle"
          npm run dist:win
          if ($LASTEXITCODE -ne 0) { Write-Error "npm run dist:win 失败（退出码 $LASTEXITCODE）"; exit 1 }

      - name: 安装包静态校验（npm run check:nsis）
        shell: pwsh
        run: |
          npm run check:nsis
          if ($LASTEXITCODE -ne 0) { Write-Error "npm run check:nsis 失败（退出码 $LASTEXITCODE）"; exit 1 }

      - name: 生成 SHA256SUMS（npm run release:checksums）
        shell: pwsh
        run: |
          npm run release:checksums
          if ($LASTEXITCODE -ne 0) { Write-Error "npm run release:checksums 失败（退出码 $LASTEXITCODE）"; exit 1 }
          if (-not (Test-Path "$env:CARGO_TARGET_DIR/release/bundle/nsis/SHA256SUMS")) { Write-Error "SHA256SUMS 没写出来"; exit 1 }

      # GitHub 会删掉资产名里的中文（v0.2.0 草稿实测），所以 Release 上传的是英文文件名的副本。
      - name: 生成发布用资产（npm run release:assets）
        # 标签构建必须带更新签名与本版本的 CHANGELOG 一节：缺了就失败，不发一个已安装客户端收不到的版本
        env:
          HWMUSIC_REQUIRE_RELEASE_METADATA: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          npm run release:assets
          if ($LASTEXITCODE -ne 0) { Write-Error "npm run release:assets 失败（退出码 $LASTEXITCODE）"; exit 1 }
          if (-not (Test-Path "$env:CARGO_TARGET_DIR/release/bundle/release-assets/SHA256SUMS")) { Write-Error "release-assets 里没有 SHA256SUMS"; exit 1 }

      - name: 验证更新签名（npm run verify:update-signature）
        shell: pwsh
        run: |
          if (Test-Path "$env:CARGO_TARGET_DIR/release/bundle/release-assets/latest.json") {
            npm run verify:update-signature
            if ($LASTEXITCODE -ne 0) { Write-Error "npm run verify:update-signature 失败（退出码 $LASTEXITCODE）"; exit 1 }
          } else {
            Write-Output "没有 latest.json（这次构建没有更新签名私钥），跳过验签"
          }

      # 注：真窗冒烟（npm run smoke:build）不进 CI——它要一个交互式桌面会话，在无人值守的运行器上只会得到
      # UNTESTED，把「没测」写进绿色流水线比不写更糟。它是本地/发布前的人工步骤。

      - name: 上传产物（main 推送与标签都留 artifact）
        uses: actions/upload-artifact@v4
        with:
          name: huawei-music-desktop-windows-nsis
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS
            src-tauri/target/release/bundle/release-assets/latest.json
            src-tauri/target/release/bundle/release-assets/RELEASE_NOTES.md
            src-tauri/binaries/hwmusic-core-*.exe

      - name: 发布 Release（仅 v* 标签）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: HWMusic ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/release-assets/HWMusic_*.exe
            src-tauri/target/release/bundle/release-assets/SHA256SUMS
            src-tauri/target/release/bundle/release-assets/latest.json
          # 正文只列本版本的新增 / 改进 / 修复（取自 CHANGELOG.md）；免责声明与源码地址在 README，标签自带对应源码包
          body_path: src-tauri/target/release/bundle/release-assets/RELEASE_NOTES.md
