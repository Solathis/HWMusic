[package]
name = "huawei-music-desktop"
version = "0.1.0"
description = "华为音乐第三方桌面客户端（非官方）"
license = "AGPL-3.0-only"
edition = "2021"

[lib]
# 集成测试与托盘 mock 测试都按这个 lib 名引用
name = "huawei_music_desktop_lib"
crate-type = ["lib"]

[[bin]]
name = "huawei-music-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable`：官方登录页宿主是**主窗里的第二个 webview**，多 webview API（`WebviewBuilder`、
# `Window::add_child`）由它把关；副作用是内容 webview 变 `WindowChild`，主窗/歌词窗改显式 bounds + 比例跟随。
tauri = { version = "2.12.4", features = ["tray-icon", "image-png", "image-ico", "unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
# 本地曲库：选文件的**只有一个** Rust 侧调用点（`local_library::pick_files`），capabilities 里没有
# `dialog:*` 权限，渲染层调不到它。版本与其余插件同一主版本。
tauri-plugin-dialog = "=2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
base64 = "0.22"
# 本地曲库：读音频文件的标签（标题/歌手/专辑/时长/内嵌封面/内嵌歌词）；只读标签，不解码音频，封面按原字节透传。
# 只读标签、不做音频解码，也不带图像处理（封面按原字节透传）。
lofty = "=0.25.5"
# 本地曲库：曲目 id 必须是不可猜的 128 位随机数（用它而不是 uuid：只要随机字节）。
getrandom = "=0.3.4"

# 仅 Windows 编译：会话加密存储（DPAPI）与任务栏歌词等用到的 Win32 API。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
] }

# macOS 14+ 才支持 webview 的 --proxy-server（webview 代理要用）。
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.12.4", features = ["macos-proxy"] }

[dev-dependencies]
tauri = { version = "2.12.4", features = ["test"] }
